		<dict>
			<key>name</key>
			<string>Strip Third-Party VAD Framework Symbols</string>
			<key>inputPaths</key>
			<array/>
			<key>buildActionMask</key>
			<string>2147483647</string>
			<key>shellPath</key>
			<string>/bin/sh</string>
			<key>outputPaths</key>
			<array/>
			<key>isa</key>
			<string>PBXShellScriptBuildPhase</string>
			<key>runOnlyForDeploymentPostprocessing</key>
			<string>0</string>
			<key>shellScript</key>
			<string># [T-ios-strip-vad-symbols] Strip local symbols from the prebuilt
# RealTimeCutVADCXXLibrary framework (RealTimeCutVADLibrary SPM package).
#
# WHY: the upstream xcframework ships unstripped. It statically links a full
# ONNX Runtime + MLAS kernel set, so the arm64 binary is ~26MB of which ~9MB is
# nothing but local symbols the app can never call. `strip -x` discards ONLY
# local symbols; all 3610 global exports (_OrtGetApiBase, _MlasGemm*, the
# Obj-C/C++ entry points) survive, so dynamic linking is unaffected.
#
# WHY THIS PHASE RUNS LAST (after Embed Frameworks):
# This framework comes from an SPM binaryTarget, and Xcode embeds those by
# copying STRAIGHT FROM THE PACKAGE ARTIFACT DIRECTORY
# ($BUILD_DIR/../../SourcePackages/artifacts/...), not from $BUILT_PRODUCTS_DIR.
# Verified empirically: stripping the $BUILT_PRODUCTS_DIR copy before the embed
# left the .app copy untouched at the original 26.45MB, because that copy is
# never the source. So the strip has to happen on the binary already inside
# .app/Frameworks, which necessarily means after the embed phase.
#
# WHY WE RE-SIGN HERE (and why that is unavoidable):
# Xcode signs an embedded framework as part of the copy. Modifying the Mach-O
# afterwards invalidates that signature, and nothing downstream re-signs the
# framework for us, so this script must do it. That is a deliberate deviation
# from "strip before the copy and let Xcode's codesign-on-copy handle it" —
# which is the tidier pattern but simply does not apply to SPM binaryTargets.
# The re-sign is narrow: same ${EXPANDED_CODE_SIGN_IDENTITY} the app itself
# uses, no entitlements (the framework has none — verified with
# `codesign -d --entitlements`), and only this one framework is touched. The
# app bundle's own signature is applied after all build phases, so re-signing a
# nested framework here is seen by that final pass, and
# `codesign --verify --deep --strict` passes on the result.
#
# Release only: Debug keeps full symbols so the framework stays debuggable.
# The gate is $CONFIGURATION rather than runOnlyForDeploymentPostprocessing,
# because that field means "only during install/archive" and would skip a plain
# `xcodebuild -configuration Release` build.
set -eu
if [ "${CONFIGURATION}" != "Release" ]; then
  echo "note: skipping VAD strip (CONFIGURATION=${CONFIGURATION}, Release only)"
  exit 0
fi
FW="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/RealTimeCutVADCXXLibrary.framework"
BIN="$FW/RealTimeCutVADCXXLibrary"
if [ ! -f "$BIN" ]; then
  echo "note: $BIN not present — nothing to strip"
  exit 0
fi
if [ "$(/usr/bin/nm "$BIN" 2&gt;/dev/null | wc -l)" -le "$(/usr/bin/nm -g "$BIN" 2&gt;/dev/null | wc -l)" ]; then
  echo "note: $BIN already stripped — skipping"
  exit 0
fi
BEFORE=$(/usr/bin/stat -f%z "$BIN")
/usr/bin/strip -x "$BIN"
AFTER=$(/usr/bin/stat -f%z "$BIN")
# Re-sign: stripping invalidated the signature Xcode applied during the copy.
if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] &amp;&amp; [ "${CODE_SIGNING_REQUIRED:-YES}" != "NO" ]; then
  /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" ${OTHER_CODE_SIGN_FLAGS:-} --preserve-metadata=identifier,flags --timestamp=none "$FW"
  echo "note: re-signed $FW with ${EXPANDED_CODE_SIGN_IDENTITY_NAME:-$EXPANDED_CODE_SIGN_IDENTITY}"
else
  echo "note: code signing disabled — skipped re-sign"
fi
echo "note: stripped VAD framework ($BEFORE -&gt; $AFTER bytes)"
</string>
